<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 2G (iOS 1.0) Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #07090e;
        }
    </style>
</head>
<body class="h-screen w-screen relative select-none flex items-center justify-center m-0 overflow-hidden bg-[#0a0c10]">

    <!-- MAIN IPHONE 2G DEVICE CONTAINER (Compact & Perfectly Sized) -->
    <div id="iphone-body" class="relative w-[280px] h-[540px] bg-gradient-to-b from-[#1c1f26] via-[#111318] to-[#0d0f13] rounded-[38px] p-2.5 border-[5px] border-[#3a3f4a] shadow-[0_20px_50px_rgba(0,0,0,0.9)] flex flex-col justify-between overflow-hidden z-20">

        <!-- BOOT SCREEN -->
        <div id="boot-screen" class="absolute inset-0 bg-black z-50 flex flex-col items-center justify-center transition-opacity duration-700">
            <div class="relative flex items-center justify-center mb-6">
                <i class="fa-brands fa-apple text-white text-5xl drop-shadow-[0_0_20px_rgba(255,255,255,0.4)]"></i>
            </div>
            <div class="w-32 h-1 bg-gray-900 rounded-full overflow-hidden border border-white/10">
                <div id="boot-progress" class="w-0 h-full bg-gradient-to-r from-blue-400 via-cyan-300 to-white transition-all duration-[1500ms] ease-out"></div>
            </div>
            <span id="boot-status-lbl" class="text-[9px] text-gray-500 mt-3 tracking-wide font-medium">Uruchamianie iPhone'a...</span>
        </div>

        <!-- TOP SPEAKER & CAMERA BEZEL -->
        <div class="w-full flex flex-col items-center pt-1 z-40 bg-black/40 rounded-t-[32px]">
            <div class="w-10 h-1 bg-gray-700 rounded-full mb-1 shadow-inner"></div>
            <div class="w-2 h-2 rounded-full bg-gray-900 border border-gray-700 absolute left-12 top-2"></div>
            <!-- Status Bar -->
            <div class="w-full px-3 flex justify-between items-center text-white text-[10px] font-medium">
                <span id="current-time">9:41</span>
                <div class="flex items-center space-x-1.5">
                    <span id="system-badge-version" class="text-[8px] bg-gray-800/80 text-gray-300 px-1.5 py-0.2 rounded font-mono">iOS 1.0</span>
                    <i class="fa-solid fa-wifi text-[8px]"></i>
                    <i class="fa-solid fa-battery-full text-[8px]"></i>
                </div>
            </div>
        </div>

        <!-- HOME SCREEN (SKEUOMORPHIC 3D ICONS) -->
        <div id="home-screen" class="relative flex-1 p-2.5 flex flex-col justify-between z-10">
            <!-- App Grid with 3D Skeuomorphic Styles -->
            <div class="grid grid-cols-3 gap-2.5 pt-1">
                
                <button onclick="openApp('youtube')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#ff3333] via-[#cc0000] to-[#880000] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(204,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-red-400/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-tv drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">YouTube</span>
                </button>

                <button onclick="openApp('settings')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#8e99a8] via-[#5c6878] to-[#3a4452] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(0,0,0,0.4),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-gray-400/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-gear drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Ustawienia</span>
                </button>

                <button onclick="openApp('safari')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#2fa5ff] via-[#0066cc] to-[#003388] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(0,102,204,0.5),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-blue-400/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-compass drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Safari</span>
                </button>

                <button onclick="openApp('photos')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#fcd34d] via-[#f59e0b] to-[#b45309] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(245,158,11,0.5),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-amber-300/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-image drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Zdjęcia</span>
                </button>

                <button onclick="openApp('camera')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#4b5563] via-[#1f2937] to-[#111827] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.4)] border border-gray-600 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-camera drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Aparat</span>
                </button>

                <button onclick="openApp('appletv')" class="flex flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#374151] via-[#111827] to-black rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.4)] border border-gray-700 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-film text-red-500 drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Apple TV</span>
                </button>

                <!-- APPS INSTALLED AFTER iOS 6 UPDATE -->
                <button id="app-icon-appstore" onclick="openApp('appstore')" class="hidden flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#38bdf8] via-[#0284c7] to-[#0369a1] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(2,132,199,0.5),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-sky-300/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-store drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">App Store</span>
                </button>

                <button id="app-icon-cydia" onclick="openApp('cydia')" class="hidden flex-col items-center group cursor-pointer">
                    <div class="w-11 h-11 bg-gradient-to-b from-[#d97706] via-[#b45309] to-[#78350f] rounded-xl flex items-center justify-center text-white text-lg shadow-[0_3px_8px_rgba(180,83,9,0.5),inset_0_1px_1px_rgba(255,255,255,0.6)] border border-amber-500/40 transform group-hover:scale-105 transition relative overflow-hidden">
                        <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/30 to-transparent rounded-t-xl pointer-events-none"></div>
                        <i class="fa-solid fa-box drop-shadow"></i>
                    </div>
                    <span class="text-white text-[8px] mt-1 font-semibold tracking-tight drop-shadow">Cydia</span>
                </button>
            </div>

            <!-- DOCK WITH 3D GLASS STYLE -->
            <div class="bg-gradient-to-b from-gray-900/90 to-black/90 backdrop-blur-md rounded-xl p-1.5 w-full flex justify-around items-center border border-white/10 shadow-lg mb-1">
                <button onclick="openApp('safari')" class="w-8 h-8 bg-gradient-to-b from-[#2fa5ff] to-[#0055aa] rounded-lg flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-compass"></i></button>
                <button onclick="openApp('settings')" class="w-8 h-8 bg-gradient-to-b from-[#6b7280] to-[#374151] rounded-lg flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-gear"></i></button>
                <button onclick="openApp('photos')" class="w-8 h-8 bg-gradient-to-b from-[#ec4899] to-[#be185d] rounded-lg flex items-center justify-center text-white text-sm shadow"><i class="fa-solid fa-image"></i></button>
            </div>
        </div>

        <!-- PHYSICAL HOME BUTTON (PRZYCISK BATON) -->
        <div class="w-full flex justify-center pb-1 z-40">
            <button onclick="pressHomeButton()" class="w-8 h-8 rounded-full bg-gradient-to-b from-[#1a1c23] to-[#0f1116] border-2 border-gray-600 flex items-center justify-center shadow-[0_2px_4px_rgba(0,0,0,0.5)] active:scale-95 transition cursor-pointer">
                <div class="w-3 h-3 rounded-[3px] border border-gray-400/60"></div>
            </button>
        </div>

        <!-- APP WINDOW CONTAINER -->
        <div id="app-window" class="absolute inset-0 bg-slate-950 z-40 hidden flex-col overflow-hidden rounded-[32px]">
            <div class="h-9 bg-black px-3 flex items-center justify-between border-b border-gray-800">
                <div class="flex items-center space-x-2 text-white font-semibold text-xs">
                    <i id="app-window-icon" class="fa-solid fa-app"></i>
                    <span id="app-window-title">Aplikacja</span>
                </div>
                <button onclick="closeApp()" class="px-2 py-0.5 bg-gray-800 hover:bg-gray-700 rounded-md text-[10px] text-white">Zamknij</button>
            </div>
            <div id="app-window-body" class="flex-1 overflow-y-auto p-2 text-white text-xs"></div>
        </div>

    </div>

    <script>
        let currentOS = "iOS 1.0";

        window.addEventListener('load', () => {
            const bootProgress = document.getElementById('boot-progress');
            setTimeout(() => { if(bootProgress) bootProgress.style.width = '100%'; }, 100);
            setTimeout(() => {
                const bootScreen = document.getElementById('boot-screen');
                if(bootScreen) {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => { bootScreen.style.display = 'none'; }, 600);
                }
            }, 2000);
            setInterval(updateClock, 1000);
        });

        function updateClock() {
            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const timeEl = document.getElementById('current-time');
            if(timeEl) timeEl.innerText = timeStr;
        }

        function pressHomeButton() {
            closeApp();
        }

        function openApp(appName) {
            const win = document.getElementById('app-window');
            const title = document.getElementById('app-window-title');
            const icon = document.getElementById('app-window-icon');
            const body = document.getElementById('app-window-body');

            win.classList.remove('hidden');
            win.classList.add('flex');

            if (appName === 'youtube') {
                title.innerText = 'YouTube';
                icon.className = 'fa-solid fa-tv text-red-500';
                body.innerHTML = `
                    <div class="flex flex-col h-full space-y-2">
                        <div class="flex items-center space-x-1 bg-gray-900 p-1.5 rounded-lg border border-gray-800">
                            <i class="fa-solid fa-magnifying-glass text-gray-400 text-[10px] ml-1"></i>
                            <input type="text" placeholder="Szukaj na YouTube..." class="w-full bg-transparent text-[11px] text-white focus:outline-none px-1"/>
                        </div>
                        <div class="flex-1 rounded-xl overflow-hidden bg-black border border-gray-800 flex flex-col">
                            <iframe class="w-full h-40 border-0" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            <div class="p-2 space-y-1">
                                <h4 class="font-bold text-[11px] text-white">Rick Astley - Never Gonna Give You Up (Official Music Video)</h4>
                                <div class="flex justify-between items-center text-[9px] text-gray-400">
                                    <span>RickAstleyVEVO • 1,4 mld wyświetleń</span>
                                    <button class="bg-red-600 text-white px-2 py-0.5 rounded font-bold">Subskrybuj</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (appName === 'settings') {
                title.innerText = 'Ustawienia';
                icon.className = 'fa-solid fa-gear text-gray-400';
                body.innerHTML = `
                    <div class="space-y-2.5">
                        <div class="p-2.5 bg-gray-900 rounded-xl border border-gray-800 space-y-1">
                            <h3 class="font-bold text-[11px]">Informacje o systemie</h3>
                            <p class="text-[10px] text-gray-400">Wersja: <span class="text-cyan-400 font-mono">${currentOS}</span></p>
                        </div>
                        <div class="p-2.5 bg-gray-900 rounded-xl border border-gray-800 space-y-2">
                            <h3 class="font-bold text-[11px]">Uaktualnienia oprogramowania</h3>
                            <p class="text-[10px] text-gray-400">Zaktualizuj do iOS 6, aby zyskać App Store, Muzykę oraz Cydię.</p>
                            <button onclick="startSystemUpdate()" class="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[11px] font-bold transition cursor-pointer">Pobierz i zainstaluj iOS 6</button>
                        </div>
                    </div>
                `;
            } else if (appName === 'safari') {
                title.innerText = 'Safari';
                icon.className = 'fa-solid fa-compass text-orange-400';
                body.innerHTML = `
                    <div class="space-y-2.5">
                        <div class="flex items-center space-x-1.5 bg-gray-900 p-1.5 rounded-lg border border-gray-800">
                            <input type="text" value="https://jailbreak.app" class="w-full bg-transparent text-[11px] text-white focus:outline-none"/>
                        </div>
                        <div class="p-2.5 bg-gray-900 rounded-xl border border-gray-800 text-center space-y-2">
                            <h3 class="font-bold text-[11px] text-purple-400">Jailbreak dla ${currentOS}</h3>
                            <button onclick="runJailbreak()" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-[11px] font-bold rounded-full transition cursor-pointer">Wykonaj Jailbreak</button>
                        </div>
                    </div>
                `;
            } else if (appName === 'photos') {
                title.innerText = 'Zdjęcia';
                icon.className = 'fa-solid fa-image text-pink-400';
                body.innerHTML = `<div class="grid grid-cols-2 gap-2"><div class="h-24 bg-gray-800 rounded-lg"></div><div class="h-24 bg-gray-800 rounded-lg"></div></div>`;
            } else if (appName === 'camera') {
                title.innerText = 'Aparat';
                icon.className = 'fa-solid fa-camera text-gray-300';
                body.innerHTML = `<div class="flex flex-col items-center justify-center h-40 bg-black rounded-xl border border-gray-800"><i class="fa-solid fa-camera text-2xl text-gray-500 mb-1"></i><span class="text-[10px] text-gray-400">Podgląd aparatu iPhone 2G</span></div>`;
            } else if (appName === 'appletv') {
                title.innerText = 'Apple TV';
                icon.className = 'fa-solid fa-film text-red-500';
                body.innerHTML = `<div class="p-2 text-center"><h3 class="font-bold text-[11px]">Odtwarzacz Wideo Apple TV</h3><p class="text-[10px] text-gray-400 mt-1">Brak dostępnych filmów w bibliotece.</p></div>`;
            } else if (appName === 'appstore') {
                title.innerText = 'App Store';
                icon.className = 'fa-solid fa-store text-blue-400';
                body.innerHTML = `<div class="p-2 text-center"><h3 class="font-bold text-[11px]">App Store (iOS 6)</h3><p class="text-[10px] text-gray-400 mt-1">Sklep z aplikacjami działa poprawnie.</p></div>`;
            } else if (appName === 'cydia') {
                title.innerText = 'Cydia';
                icon.className = 'fa-solid fa-box text-amber-500';
                body.innerHTML = `<div class="p-2 text-center"><h3 class="font-bold text-[11px]">Cydia Store</h3><p class="text-[10px] text-gray-400 mt-1">Wszystkie pakiety i tweak'i są dostępne.</p></div>`;
            }
        }

        function closeApp() {
            document.getElementById('app-window').classList.add('hidden');
            document.getElementById('app-window').classList.remove('flex');
        }

        function runJailbreak() {
            alert("Uruchomiono proces Jailbreak dla " + currentOS + "! Cydia została zainstalowana.");
            document.getElementById('app-icon-cydia').classList.remove('hidden');
            document.getElementById('app-icon-cydia').classList.add('flex');
            closeApp();
        }

        function startSystemUpdate() {
            closeApp();
            const bootScreen = document.getElementById('boot-screen');
            const bootProgress = document.getElementById('boot-progress');
            const bootStatus = document.getElementById('boot-status-lbl');

            bootScreen.style.display = 'flex';
            bootScreen.style.opacity = '1';
            bootProgress.style.width = '0%';
            bootStatus.innerText = "Instalowanie uaktualnienia do iOS 6...";

            setTimeout(() => { bootProgress.style.width = '60%'; }, 1000);
            setTimeout(() => {
                bootProgress.style.width = '100%';
                currentOS = "iOS 6.1.6";
                document.getElementById('system-badge-version').innerText = "iOS 6";
                
                ['app-icon-appstore'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) { el.classList.remove('hidden'); el.classList.add('flex'); }
                });

                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => { bootScreen.style.display = 'none'; }, 500);
                }, 1000);
            }, 3000);
        }
    </script>
</body>
</html>
